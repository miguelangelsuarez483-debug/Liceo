<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Liceo Comercial - Contacto</title>
        <meta name="author" content="Miguel Suárez">
        <meta name="description" content="Contacto y acceso administrativo de la trivia interactiva del Liceo Comercial.">

        <meta name="keywords" content="trivia interactiva liceo, cuestionario programación 
        chile, juegos de trivia escolar, programación interactiva, 
        liceo comercial, administración, gestión de eventos, 
        catálogo de servicios, servicios escolares, certificado de participación, 
        descuento estudiantil, 10 por ciento de descuento, quiz escolar, preguntas y respuestas, 
        conocimientos de programación, aprender a programar, código, desarrollo web, html css javascript, 
        estudiantes, profesores, comunidad educativa, colegio, escuela técnica, finanzas escolares, 
        precios de servicios, asesoría administrativa, organización de eventos, contacto liceo, 
        formulario de contacto, equipo desarrollador, proyecto escolar, tarea de programación, 
        gestión escolar, trivia online, juego educativo, aprendizaje interactivo, tecnología educativa, 
        sitio web escolar, cuestionario dinámico, evaluación de conocimientos, beneficios y premios, inscripción en línea">

        <link rel="stylesheet" href="CSS/styles.css">
    </head>
    <body>
        <header class="header-video">
            <video class="video-fondo" autoplay muted loop playsinline>
                <source src="JS/media/video.mp4" type="video/mp4">
            </video>
            <div class="header-contenido">
                <h1>Liceo Comercial</h1>

                <button id="boton_menu">Menu</button>

                <nav>
                    <a href="index.html">Inicio</a>
                    <a href="nosotros.html">Nosotros</a>
                    <a href="servicios.html">Servicios</a>
                    <a href="finanzas.html">Finanzas</a>
                    <a href="contacto.html">Contacto</a>
                </nav>
            </div>
        </header>
        <main>

            <!-- CLASE 8: formulario validado con JS (sin "required" del navegador,
                 porque las validaciones ahora las controla nuestro propio script) -->
            <section id="formulario-contacto">

                <p>Escríbenos:</p>

                <form id="form-contacto">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre">
                    <p id="error-nombre" class="advertencia-roja"></p>

                    <label for="correo">Correo</label>
                    <input type="email" id="correo">
                    <p id="error-correo" class="advertencia-roja"></p>

                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono">
                    <p id="error-telefono" class="advertencia-roja"></p>

                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" rows="4"></textarea>
                    <p id="error-mensaje" class="advertencia-roja"></p>
                    <br><br>

                    <button type="submit">Enviar</button>
                    <p id="mensaje-exito" style="display:none;"></p>
                </form>

            </section>

            <!-- CLASE 7: acceso del administrador -->
            <section id="login-seccion">

                <p>Acceso Administrador:</p>

                <form id="login-form">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" required>
                    <label for="clave">Clave</label>
                    <input type="password" id="clave" required>
                    <br><br>

                    <button type="submit">Ingresar</button>

                    <p id="mensaje-login"></p>
                </form>

            </section>

            <!-- CLASE 7: panel de administración, oculto hasta iniciar sesión -->
            <section id="panel-admin" style="display:none;">

                <p>Panel de Administración - Historial de la trivia:</p>

                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Puntaje</th>
                            <th>Descuento aplicado</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla-intentos">
                        <!-- se llena solo desde localStorage vía js/app.js -->
                    </tbody>
                </table>

            </section>

        </main>

        <footer>
            <p class="parrafo">&copy; 2026 Liceo Comercial.</p>
        </footer>

        <script src="JS/app.js"></script>
    </body>
</html>
